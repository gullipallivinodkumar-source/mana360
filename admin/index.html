<!doctype html><html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MANA360 Admin</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#17243b}.wrap{max-width:1000px;margin:35px auto;padding:0 18px}.box{background:#fff;border:1px solid #e1e8f2;border-radius:20px;padding:25px;box-shadow:0 10px 30px rgba(10,35,70,.07)}h1{color:#061a43}label{display:block;font-weight:800;margin:16px 0 7px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #d5deea;border-radius:10px;padding:12px;font-size:15px}textarea{min-height:100px}.editor{min-height:360px;border:1px solid #d5deea;border-radius:10px;padding:15px;line-height:1.8}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.toolbar button{border:1px solid #ccd7e6;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}.actions{margin-top:20px;display:flex;gap:10px}.publish{background:#0878df;color:#fff;border:0;border-radius:10px;padding:13px 22px;font-weight:800;cursor:pointer}.clear{background:#eee;border:0;border-radius:10px;padding:13px 18px}.msg{margin-top:16px;padding:12px;border-radius:10px;display:none}.ok{display:block;background:#eaf8ef;color:#166534}.err{display:block;background:#fff0f0;color:#b91c1c}.small{color:#66758b;font-size:13px}@media(max-width:650px){.wrap{margin:15px auto}.box{padding:18px}}</style></head><body><div class="wrap"><div class="box"><h1>📝 MANA360 — New Article</h1><p class="small">ఇక్కడ article రాసి Publish చేస్తే GitHubలో file create అవుతుంది, Home, Category, Search మరియు Sitemap update అవుతాయి.</p>
<label>Admin Password</label><input id="pw" type="password" placeholder="Cloudflare ADMIN_PASSWORD">
<label>Article Title</label><input id="title" placeholder="ఉదా: 2026లో Smartphone కొనేటప్పుడు చూడాల్సిన 10 విషయాలు">
<label>Category</label><select id="cat"><option>AI</option><option>Tech</option><option>News</option><option>YouTube</option><option>Business</option><option>Education</option><option>Devotional</option><option>Stories</option><option>Tips</option><option>Offers</option><option>Movie Reviews</option><option>Movie News</option><option>AI Stories</option></select>
<label>Short Description</label><textarea id="desc" placeholder="Article గురించి 1–2 lines..."></textarea>
<label>Slug</label><input id="slug" placeholder="smartphone-konetappudu-10-vishayalu"><p class="small">English letters/numbers/hyphens మాత్రమే. ఖాళీగా వదిలితే title నుంచి auto-generate అవుతుంది.</p>
<label>Article Content</label><div class="toolbar"><button type="button" onclick="cmd('bold')"><b>Bold</b></button><button type="button" onclick="cmd('formatBlock','h2')">H2</button><button type="button" onclick="cmd('insertUnorderedList')">• List</button><button type="button" onclick="cmd('insertOrderedList')">1. List</button></div><div id="content" class="editor" contenteditable="true"><p>ఇక్కడ మీ article రాయండి...</p></div>
<div class="actions"><button class="publish" onclick="publish()">🚀 Publish Article</button><button class="clear" onclick="location.reload()">Clear</button></div><div id="msg" class="msg"></div></div></div>
<script>function cmd(c,v){document.execCommand(c,false,v)}function slugify(s){return s.toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,90)}document.getElementById('title').addEventListener('input',()=>{const s=document.getElementById('slug');if(!s.dataset.edited)s.value=slugify(document.getElementById('title').value)});document.getElementById('slug').addEventListener('input',e=>e.target.dataset.edited='1');async function publish(){const msg=document.getElementById('msg');msg.className='msg';msg.textContent='Publishing...';msg.style.display='block';const data={title:title.value,category:cat.value,description:desc.value,slug:slug.value||slugify(title.value),content:content.innerHTML};try{const r=await fetch('/api/publish',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':pw.value},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Publish failed');msg.className='msg ok';msg.innerHTML='✅ Published successfully! <a href="'+j.url+'" target="_blank">Open article</a>';}catch(e){msg.className='msg err';msg.textContent='❌ '+e.message;}}</script></body></html>
